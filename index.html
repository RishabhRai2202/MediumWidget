<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Topic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="landing-container">
        <h1>What topic would you like to see?</h1>
        <input type="text" id="topic-input" placeholder="Enter a topic...">
        <button id="search-btn">→</button>
    </div>

    <script>
        document.getElementById("search-btn").addEventListener("click", () => {
            const topic = document.getElementById("topic-input").value.trim();
            if (topic) {
                localStorage.setItem("selectedTopic", topic);
                window.location.href = "widget.html";
            }
        });

        document.getElementById("topic-input").addEventListener("keypress", (event) => {
            if (event.key === "Enter") {
                document.getElementById("search-btn").click();
            }
        });
    </script>
</body>
</html>
