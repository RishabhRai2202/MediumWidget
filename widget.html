<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medium Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .story-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            border: 1px solid #4A5568; /* gray-700 */
        }
        .story-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border-color: #3B82F6; /* blue-500 */
        }
        .skeleton {
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            50% {
                opacity: .5;
            }
        }
        /* Custom Scrollbar Styles */
        body::-webkit-scrollbar {
            width: 12px;
        }
        body::-webkit-scrollbar-track {
            background: #111827; /* gray-900 */
        }
        body::-webkit-scrollbar-thumb {
            background-color: #374151; /* gray-800 */
            border-radius: 20px;
            border: 3px solid #111827; /* gray-900 */
        }
        body::-webkit-scrollbar-thumb:hover {
            background-color: #4B5563; /* gray-700 */
        }
        /* Ensure transparent body for Electron */
        html, body {
            background-color: transparent;
        }
    </style>
</head>
<body class="text-white">

    <div id="widget-content" class="bg-gray-900/95 backdrop-blur-md max-w-4xl mx-auto p-4 md:p-6 rounded-2xl border border-gray-700">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-gray-300 tracking-wider">MEDIUM WIDGET</h1>
            <button id="close-btn" class="text-gray-500 hover:text-red-500 transition-colors duration-200" title="Close Widget">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </header>

        <!-- Topic Input -->
        <div id="topic-container" class="mb-6">
            <div class="flex items-center bg-gray-800 rounded-full p-1 border border-gray-600 focus-within:ring-2 focus-within:ring-blue-500">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 mx-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14" />
                </svg>
                <input type="text" id="topic-input" placeholder="Enter a topic and press Enter..." class="w-full bg-transparent text-white placeholder-gray-500 border-none outline-none px-2 py-2 text-md">
            </div>
        </div>

        <!-- Stories Container -->
        <main id="stories-container" class="grid grid-cols-1 gap-4" style="max-height: 300px; overflow-y: auto;">
             <!-- Skeleton Loader -->
            <div class="skeleton bg-gray-800 rounded-lg h-28"></div>
            <div class="skeleton bg-gray-800 rounded-lg h-28"></div>
            <div class="skeleton bg-gray-800 rounded-lg h-28"></div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
